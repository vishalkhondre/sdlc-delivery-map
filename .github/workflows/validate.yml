name: Validate
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install browser and release dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check lesson structure, sources and hotspots
        run: python scripts/validate.py source
      - name: Check reviewed edition
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ARGS=()
          if [[ -n "$BASE" ]]; then ARGS+=(--base "$BASE"); fi
          python scripts/check_release.py check "${ARGS[@]}"
      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and check all navigation
        env:
          SDLC_INTEGRATION_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          python site/generate.py
          python scripts/validate.py links --integration
          python scripts/check_browser.py --integration
      - name: Build the field guide preview
        if: github.event_name == 'pull_request'
        run: |
          if ! command -v inkscape >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends inkscape
          fi
          python scripts/field_guide_pdf.py --preview "$RUNNER_TEMP/SDLC-Field-Guide-Integration.pdf"
      - name: Upload the field guide preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: field-guide-preview
          path: ${{ runner.temp }}/SDLC-Field-Guide-Integration.pdf
          if-no-files-found: error
      - name: Upload the verified Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
