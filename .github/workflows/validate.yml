name: Validate
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install browser and release dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check lesson structure, sources, hotspots and review
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/validate.py source
          ARGS=()
          if [[ -n "$BASE" ]]; then ARGS+=(--base "$BASE"); fi
          python scripts/check_release.py check "${ARGS[@]}"
          python -m unittest discover -s scripts/tests -v
      - name: Build and check all navigation
        run: |
          python site/generate.py
          python scripts/validate.py links
          python scripts/check_browser.py
      - name: Upload the verified Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
