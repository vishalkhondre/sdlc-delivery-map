<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 636" role="img" aria-labelledby="title desc">
<title id="title">Recover from a UAT rejection</title><desc id="desc">uat-80 rejected the candidate on uat-r8 because unit B reached unit A’s approver. Hold release. The actual mapping repair kept build-418, followed by qa-209 and a new decision, uat-82 on uat-r9. A hypothetical code repair requires a new build and digest, QA qualification, and another business decision. Either route that fails stays on hold and retains uat-80.</desc>
<defs><marker id="tip" viewBox="0 0 9 10" refX="8" refY="5" markerWidth="9" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 5 L0 10 z" fill="#345765"/></marker></defs>
<path fill="#f5f7f6" d="M0 0H456V636H0z"/>
<text x="16" y="32" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#162f40">Recover from a UAT rejection</text>
<g data-label-box=""><rect x="16" y="55" width="424" height="87" rx="7" fill="#fff0e1" stroke="#aa622a" stroke-width="1.5"/>
<text x="28" y="81" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">uat-80 rejected · hold release</text>
<text x="28" y="106" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">uat-r8 with uat-routing-5 sent Purchasing unit B</text>
<text x="28" y="128" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">to unit A’s approver.</text>
</g>
<path d="M228 142V163" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="16" y="164" width="424" height="65" rx="7" fill="#e7eef7" stroke="#61809d" stroke-width="1.5"/>
<text x="28" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">What caused the wrong recipient?</text>
<text x="28" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Inspect the mapping, digest and assignment event.</text>
</g>
<path d="M228 229V245" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round"/>
<path d="M228 245H117V263" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M228 245H339V263" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)" stroke-dasharray="5 4"/>
<g data-label-box=""><rect x="16" y="264" width="202" height="109" rx="7" fill="#e1f0e9" stroke="#4e816c" stroke-width="1.5"/>
<text x="28" y="290" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">Actual · mapping</text>
<text x="28" y="315" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Correct the UAT map.</text>
<text x="28" y="337" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Keep build-418 and</text>
<text x="28" y="359" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">its original digest.</text>
</g>
<g data-label-box=""><rect x="238" y="264" width="202" height="109" rx="7" fill="#f6f5fa" stroke="#80758b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="250" y="290" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">Alternative · code</text>
<text x="250" y="315" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Repair reviewed code.</text>
<text x="250" y="337" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Publish a new build</text>
<text x="250" y="359" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">and digest.</text>
</g>
<path d="M117 373V394" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M339 373V394" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)" stroke-dasharray="5 4"/>
<g data-label-box=""><rect x="16" y="395" width="202" height="175" rx="7" fill="#e1f0e9" stroke="#4e816c" stroke-width="1.5"/>
<text x="28" y="421" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">qa-209 → uat-82</text>
<text x="28" y="446" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">QA rechecks routing</text>
<text x="28" y="468" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">and permissions.</text>
<text x="28" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Business repeats the</text>
<text x="28" y="512" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">scenario on uat-r9</text>
<text x="28" y="534" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">with uat-routing-6.</text>
<text x="28" y="556" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">uat-82 accepts.</text>
</g>
<g data-label-box=""><rect x="238" y="395" width="202" height="153" rx="7" fill="#f6f5fa" stroke="#80758b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="250" y="421" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">Fresh qualification</text>
<text x="250" y="446" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Run QA against the</text>
<text x="250" y="468" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">new digest. Repeat</text>
<text x="250" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">UAT on that candidate.</text>
<text x="250" y="512" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">The signatory makes</text>
<text x="250" y="534" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">a new decision.</text>
</g>
<text x="16" y="604" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#162f40">If either route fails, keep the release on hold.</text>
<text x="16" y="627" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162f40">Retain uat-80 alongside the new evidence.</text>
</svg>
