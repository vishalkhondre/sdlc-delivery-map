<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 851" role="img" aria-labelledby="title desc">
<title id="title">Follow the accepted image</title><desc id="desc">Follow PR-42 and its integrated commit to build-418, its linux/amd64 digest, qa-204, rejected uat-80, qa-209 and accepted uat-82. The Release Manager verifies the recorded authorization for the digest. The operator checks the observed digest and configuration on prod-r42, then links smoke. On mismatch hold rollout. From smoke, follow each prior record back to the integrated commit. The same digest routed differently on prod-r41.</desc>
<defs><marker id="tip" viewBox="0 0 9 10" refX="8" refY="5" markerWidth="9" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 5 L0 10 z" fill="#345765"/></marker></defs>
<path fill="#f5f7f6" d="M0 0H452V851H0z"/>
<text x="16" y="32" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#162f40">Follow the accepted image</text>
<text x="16" y="60" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162f40">Read down to delivery, or up from smoke to source.</text>
<g data-label-box=""><rect x="16" y="79" width="420" height="65" rx="7" fill="#ffffff" stroke="#92a5ae" stroke-width="1.5"/>
<text x="28" y="105" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">PR-42 → integrated source</text>
<text x="28" y="130" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Commit 3ab862bc… feeds build-418.</text>
</g>
<path d="M226 144V163" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="16" y="164" width="420" height="87" rx="7" fill="#ffffff" stroke="#92a5ae" stroke-width="1.5"/>
<text x="28" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">build-418 → published image</text>
<text x="28" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">sha256:041f649d… for linux/amd64.</text>
<text x="28" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Compare the full digest in each record.</text>
</g>
<path d="M226 251V270" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="16" y="271" width="420" height="109" rx="7" fill="#ffffff" stroke="#92a5ae" stroke-width="1.5"/>
<text x="28" y="297" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">QA → business decision</text>
<text x="28" y="322" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">qa-204 passes. uat-80 rejects the UAT mapping.</text>
<text x="28" y="344" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">qa-209 rechecks the rule and permissions.</text>
<text x="28" y="366" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">uat-82 accepts on uat-r9 with uat-routing-6.</text>
</g>
<path d="M226 380V401" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="16" y="402" width="420" height="87" rx="7" fill="#e7eef7" stroke="#61809d" stroke-width="1.5"/>
<text x="28" y="428" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">May we deploy?</text>
<text x="28" y="453" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Release Manager reviews QA, UAT and mapping.</text>
<text x="28" y="475" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Authorization for 1.3.0 names sha256:041f649d…</text>
</g>
<path d="M226 489V510" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="16" y="511" width="420" height="109" rx="7" fill="#e1f0e9" stroke="#4e816c" stroke-width="1.5"/>
<text x="28" y="537" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">What ran?</text>
<text x="28" y="562" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Operator reads prod-rollout-87 and prod-r42.</text>
<text x="28" y="584" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Observed image matches the authorized digest.</text>
<text x="28" y="606" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Active configuration is prod-routing-11.</text>
</g>
<path d="M226 620V641" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="16" y="642" width="420" height="87" rx="7" fill="#e1f0e9" stroke="#4e816c" stroke-width="1.5"/>
<text x="28" y="668" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#162f40">Smoke → exposure decision</text>
<text x="28" y="693" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">The rule assigns the designated test approver.</text>
<text x="28" y="715" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">The owner observes routing before expanding.</text>
</g>
<text x="16" y="763" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#162f40">Digest mismatch? Hold rollout and investigate.</text>
<text x="16" y="790" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162f40">prod-r41 used the same image with prod-routing-10.</text>
<text x="16" y="813" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#162f40">It sent a controlled request to the wrong recipient.</text>
</svg>
