<path d="M145 251V281" fill="none" stroke="#235e70" stroke-width="2.5" marker-end="url(#tip)"/>
<path d="M145 351V379" fill="none" stroke="#235e70" stroke-width="2.5" marker-end="url(#tip)"/>
<path d="M145 449V496" fill="none" stroke="#235e70" stroke-width="2.5" marker-end="url(#tip)"/>
<path d="M268 203H326" fill="none" stroke="#235e70" stroke-width="2.5" marker-end="url(#tip)"/>
<path d="M329 237H271" fill="none" stroke="#235e70" stroke-width="2.5" marker-end="url(#tip)"/>
<path d="M268 406H326" fill="none" stroke="#235e70" stroke-width="2.5" marker-end="url(#tip)"/>
