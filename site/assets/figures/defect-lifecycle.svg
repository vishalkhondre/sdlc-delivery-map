<text x="339" y="558" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183452">Recurrence</text>
<text x="159" y="479" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183452">qa-198 passes</text>
<text x="24" y="609" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#183452">The triage owner records closure after reviewing the retest.</text>
<text x="24" y="634" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#183452">Keep the original failure and the repair result on their own builds.</text>
</svg>
