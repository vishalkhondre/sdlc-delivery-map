<text x="364" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#425c69">Set Reopened.</text>
<text x="364" y="677" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#425c69">Clear resolution.</text>
