<text x="20" y="655" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">Integrate and</text>
<text x="20" y="677" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">build again.</text>
<text x="20" y="699" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">build-418</text>
<text x="20" y="721" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#425c69">041f649d…</text>
</g>
<path d="M158 652H178" fill="none" stroke="#345765" stroke-width="2" stroke-linejoin="round" marker-end="url(#tip)"/>
<g data-label-box=""><rect x="180" y="604" width="150" height="109" rx="7" fill="#e1f0e9" stroke="#4e816c" stroke-width="1.5"/>
<text x="192" y="630" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#162f40">qa-204</text>
<text x="192" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#425c69">Qualify the</text>
<text x="192" y="677" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#425c69">integrated image</text>
<text x="192" y="699" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#425c69">on its own digest.</text>
</g>
<text x="16" y="785" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#162f40">Keep qa-196. The optional link points from Jira back to Kiwi.</text>
<text x="16" y="810" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#162f40">Adding the comment requires reporter selection and permission.</text>
</svg>
